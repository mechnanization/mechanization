# Local development stack.
#
# Postgres and object storage are hosted (Supabase); Redis is the one local
# data store, and it backs an optimisation, not a source of truth — the
# dashboard cache degrades to "reads go straight to Postgres" if it is
# missing, so `docker compose down -v` can lose the cache contents but never
# real data.

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ['6379:6379']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: ./apps/backend/.env
    environment:
      # Overrides whatever REDIS_URL is in .env: inside compose the only
      # reachable Redis is the service above, addressed by service name — the
      # value in .env is for `pnpm dev` on the host, where that name doesn't
      # resolve.
      REDIS_URL: redis://redis:6379
      # Repeated from the Dockerfile so it survives `env_file` — a TZ line in
      # apps/backend/.env would otherwise win and move the clock the billing
      # period keys are read against.
      TZ: UTC
      # This stack is one backend process, so it owns the schedule. Stated
      # rather than inferred from the absence of $VERCEL: the second replica
      # anyone adds here must set this to false, and a value that is written
      # down is a value someone can find.
      SCHEDULER_ENABLED: 'true'
    ports: ['4000:4000']
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness, not liveness: the frontend should wait until the registry is
      # actually reachable, otherwise its first page render 500s.
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:4000/api/v1/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Baked in at build time — NEXT_PUBLIC_* is inlined into the bundle, so
        # setting it only at runtime would have no effect.
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    env_file: ./apps/frontend/.env.local
    ports: ['3000:3000']
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
