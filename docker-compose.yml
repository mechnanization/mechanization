# Local development stack.
#
# `postgres` is the local development database, the target `local` in
# scripts/db/targets.mjs. It holds what `pnpm db:seed` and the cadastre import
# put there: synthetic citizens and the real parcel map, never a copy of
# staging or production (AGENTS.md §4). `docker compose down -v` deletes it,
# and the fix is to seed again (docs/database-environments.md §0).
#
# Redis backs an optimisation, not a source of truth: the dashboard cache
# degrades to "reads go straight to Postgres" if it is missing.
#
# Both are published on 127.0.0.1 only. Nothing on the network needs to reach
# a developer's database or cache.

services:
  postgres:
    # 17, not 16: tenant migration 0044 uses ALTER COLUMN … SET EXPRESSION,
    # which Postgres 17 introduced. Same major version as CI and Lightsail.
    image: postgres:17-alpine
    environment:
      # The cluster's superuser, for `docker compose exec postgres psql -U postgres`.
      # The application connects as appuser_local, created by local-init.sql.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: postgres
    # 5434 because 5432 is commonly a Postgres installed on the machine itself,
    # and 5433 is the SSH tunnel to the Lightsail cluster. targets.mjs refuses a
    # `local` URL on any other port.
    ports: ['127.0.0.1:5434:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/db/local-init.sql:/docker-entrypoint-initdb.d/10-local-init.sql:ro
    healthcheck:
      # Over TCP on purpose: while the init script runs, the image serves a
      # temporary server on the unix socket only, and a socket check would call
      # a half-initialised database healthy.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U appuser_local -d municipality_db_local']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ['127.0.0.1:6379:6379']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: ./apps/backend/.env
    environment:
      # Override the database and Redis URLs in .env. Inside compose the only
      # reachable services are the ones above, addressed by service name. The
      # values in .env are for `pnpm dev` on the host, where 127.0.0.1:5434 is
      # the published port; inside this container it would be the container.
      DATABASE_URL: postgresql://appuser_local:localdev@postgres:5432/municipality_db_local
      DIRECT_URL: postgresql://appuser_local:localdev@postgres:5432/municipality_db_local
      REDIS_URL: redis://redis:6379
      # Repeated from the Dockerfile so it survives `env_file` — a TZ line in
      # apps/backend/.env would otherwise win and move the clock the billing
      # period keys are read against.
      TZ: UTC
      # This stack is one backend process, so it owns the schedule. Stated
      # rather than inferred from the absence of $VERCEL: the second replica
      # anyone adds here must set this to false, and a value that is written
      # down is a value someone can find.
      SCHEDULER_ENABLED: 'true'
    ports: ['4000:4000']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness, not liveness: the frontend should wait until the registry is
      # actually reachable, otherwise its first page render 500s.
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:4000/api/v1/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Baked in at build time — NEXT_PUBLIC_* is inlined into the bundle, so
        # setting it only at runtime would have no effect.
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    env_file: ./apps/frontend/.env.local
    ports: ['3000:3000']
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
