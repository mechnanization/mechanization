name: Deploy Backend

on:
  push:
    branches: [main]

# Read only, every job (SEC-09): nothing here writes to the repository or asks
# GitHub for a token. The pre-migration backup signs in with the access keys of
# db-production, not through OIDC, so no job holds `id-token: write`.
permissions:
  contents: read

# A deploy never overlaps another deploy or a rollback: they share the
# candidate's pm2 name, port 4001 and the `current` symlink on the box.
# `rollback-production.yml` takes the same group.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # CI first, the dependency audit with it (SEC-09). Branch protection on main
  # requires no status check, so without this a release merged with CI red
  # migrated production and shipped. The same workflow every branch runs,
  # called, so the gate and the branch checks cannot drift apart. It holds no
  # secret: none is passed to it.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Schema first, then code. A release that needs a migration must never go
  # live before it, which is the order this repository has kept by hand for
  # every migration so far ("apply BEFORE code").
  #
  # The previous release keeps serving traffic while this runs, and until the
  # cutover below, so every migration that runs here has to be additive:
  # expand/contract, docs/database-environments.md §4. The guard enforces
  # that. It refuses data-losing DDL here, and the contract step of such a
  # change goes through the manual Deploy production workflow instead.
  #
  # If this job fails, `deploy` does not run: production keeps the previous
  # release, against a schema that was either untouched or changed additively.
  migrate:
    name: migrate databases
    needs: ci
    uses: ./.github/workflows/migrate-database.yml
    permissions:
      contents: read
    with:
      target: production
      confirm: municipality_db
    secrets: inherit

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    # The environment that holds the box's SSH key (SEC-09). db-production
    # admits protected branches only, so once the SSH_* secrets live there and
    # in db-staging (the migration tunnel reaches the same box from both) and
    # no longer as repository secrets, a workflow edited on any other branch
    # cannot read them. Until they are moved, the repository's copies answer.
    environment: db-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          cd apps/backend
          npx prisma generate --schema=src/infrastructure/prisma/registry/schema.prisma
          npx prisma generate --schema=src/infrastructure/prisma/tenant/schema.prisma

      - name: Build shared packages and backend
        run: |
          pnpm --filter "./packages/*" build
          pnpm --filter "@mechanization/backend" build

      - name: Assemble deployment bundle
        run: |
          # Start from nothing, so a re-run on a warm runner cannot inherit a
          # previous attempt's tree — the failure mode below is invisible when
          # the destination happens not to exist yet.
          rm -rf deploy-output release

          # Production node_modules via pnpm deploy (resolves workspace deps into
          # a self-contained tree). apps/backend/package.json declares no "files"
          # field, so this carries everything unignored — dist/ included, since
          # the build step above has already produced it.
          pnpm --filter "@mechanization/backend" deploy --prod ./deploy-output

          # Reconstruct the layout the server expects: apps/backend/{dist,node_modules,package.json}
          #
          # dist comes straight from the build above rather than through
          # deploy-output. It used to be copied into deploy-output/dist first,
          # and `cp -r src dst` copies src *inside* dst when dst already exists —
          # so on every run where pnpm deploy had produced a dist/, the result
          # was dist/dist/, shipped to the server alongside the real one. The
          # app still booted (main.js was at the right path either way), which is
          # why it survived: what was actually deployed was a second, stale copy
          # of the whole compiled app sitting where anyone debugging would read
          # it by mistake.
          mkdir -p release/apps/backend
          cp -r apps/backend/dist          release/apps/backend/dist
          cp -r deploy-output/node_modules release/apps/backend/node_modules
          cp    deploy-output/package.json release/apps/backend/package.json

          # Assert the shape rather than trust it. Both halves matter: the entry
          # point must exist, and there must be exactly one dist level — the bug
          # above never broke the first check, only the second.
          test -f release/apps/backend/dist/presentation/main.js \
            || { echo "FATAL: main.js missing from bundle"; find release/apps/backend/dist -maxdepth 2; exit 1; }
          test ! -e release/apps/backend/dist/dist \
            || { echo "FATAL: nested dist/dist/ in bundle"; exit 1; }

      - name: Package release
        run: |
          tar -czf release.tar.gz -C release .

      - name: Set release name
        id: vars
        run: echo "release=$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Trust the server's host key and load the deploy key
        # OpenSSH on the runner, as the migration tunnel does (migrate-database.yml),
        # in place of two third-party actions that were handed the private key
        # and pinned by tag (SEC-09). The host key is checked against
        # SSH_KNOWN_HOSTS and never learned on the fly: a fresh runner that
        # accepted the first key it saw would accept whatever answered at that
        # address, and hand it the release.
        #
        # Every later step reaches the box as `ssh deploy-box`, through the
        # entry written here: the host, the user, the key, the pinned host keys.
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS is not set. Add the server's host keys: see docs/database-environments.md §6."
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/deploy_known_hosts"
          {
            echo "Host deploy-box"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  IdentityFile $HOME/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  UserKnownHostsFile $HOME/.ssh/deploy_known_hosts"
            echo "  StrictHostKeyChecking yes"
            echo "  BatchMode yes"
            echo "  ServerAliveInterval 30"
          } >> "$HOME/.ssh/config"

      - name: Copy release to server
        # Streamed over the session rather than scp, so the box needs nothing
        # but a shell (no SFTP subsystem); lands where the step below reads it.
        env:
          RELEASE: ${{ steps.vars.outputs.release }}
        run: |
          set -euo pipefail
          UPLOAD_DIR="/var/www/municipality-app-releases/releases/$RELEASE-upload"
          ssh deploy-box "set -e; mkdir -p '$UPLOAD_DIR'; cat > '$UPLOAD_DIR/release.tar.gz'" < release.tar.gz

      - name: Extract, boot candidate on port 4001, health-check, then cut over
        # The script is the command the session runs, as the action ran it; the
        # release name is the only value put into it, and it is the
        # timestamp-and-SHA the step above built.
        env:
          RELEASE: ${{ steps.vars.outputs.release }}
        run: |
          set -euo pipefail
          case "$RELEASE" in
            *[!A-Za-z0-9-]*|'') echo "::error::Unexpected release name '$RELEASE'"; exit 1 ;;
          esac
          remote=$(cat <<'REMOTE'
            set -e
            RELEASE_DIR=/var/www/municipality-app-releases/releases/$RELEASE
            UPLOAD_DIR=${RELEASE_DIR}-upload

            mkdir -p $RELEASE_DIR
            tar -xzf $UPLOAD_DIR/release.tar.gz -C $RELEASE_DIR
            rm -rf $UPLOAD_DIR

            # Sanity-check the entry point exists before touching anything
            if [ ! -f "$RELEASE_DIR/apps/backend/dist/presentation/main.js" ]; then
              echo "FATAL: main.js missing from release bundle — aborting"
              ls -la $RELEASE_DIR/apps/backend/ || true
              rm -rf $RELEASE_DIR
              exit 1
            fi

            mkdir -p $RELEASE_DIR/apps/backend
            ln -sfn /var/www/municipality-app-releases/shared/backend/.env $RELEASE_DIR/apps/backend/.env

            # Clean up any stale candidate from a previous failed deploy
            pm2 delete municipality-app-candidate 2>/dev/null || true

            # Boot the NEW release as a single-instance candidate on port 4001.
            # Production (port 4000) is completely untouched.
            PORT=4001 pm2 start $RELEASE_DIR/apps/backend/dist/presentation/main.js \
              --name municipality-app-candidate \
              --cwd $RELEASE_DIR/apps/backend \
              --update-env

            HEALTHY=false
            for i in $(seq 1 60); do
              if curl -sf http://localhost:4001/api/v1/health > /dev/null; then
                HEALTHY=true
                echo "Candidate healthy after $((i*2))s"
                break
              fi
              echo "Waiting for candidate to become healthy... ($i/60)"
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "Candidate FAILED health check after 120s — aborting deploy, production untouched"
              pm2 logs municipality-app-candidate --lines 50 --nostream || true
              pm2 delete municipality-app-candidate || true
              rm -rf $RELEASE_DIR
              exit 1
            fi

            echo "Cutting over production symlink and reloading main cluster"
            pm2 delete municipality-app-candidate

            ln -sfn $RELEASE_DIR /var/www/municipality-app-releases/current
            pm2 reload /var/www/municipality-app-releases/ecosystem.config.js

            sleep 3
            POST_HEALTHY=false
            for i in $(seq 1 30); do
              if curl -sf http://localhost:4000/api/v1/health > /dev/null; then
                POST_HEALTHY=true
                break
              fi
              sleep 2
            done

            if [ "$POST_HEALTHY" = "true" ]; then
              echo "Production healthy after cutover"
              cd /var/www/municipality-app-releases/releases
              ls -t | tail -n +11 | xargs -r rm -rf
            else
              echo "Production unhealthy after cutover — investigate immediately"
              exit 1
            fi
          REMOTE
          )
          ssh deploy-box "RELEASE='$RELEASE'; $remote"
