name: Backup production

# The production project is on the Supabase **free** plan, which means no daily
# backups, no Point-in-Time Recovery, and no downloadable backup in the
# dashboard. Until that changes, this workflow is the only copy of the register
# that exists anywhere. `docs/database-environments.md` §5 is written as though
# the platform provides a floor underneath this. It does not, yet.
#
# ── The order of the steps is the design ─────────────────────────────────────
#
#   dump → prove it restores → encrypt → upload → prove the upload arrived
#
# The restore rehearsal runs *before* the upload, against a throwaway Postgres,
# on the real dump. So a backup that cannot be restored is never stored: the job
# fails, nothing is uploaded, and yesterday's good backup is still sitting
# untouched in the bucket. The failure mode this avoids is the one that has
# already happened here once — `BackupService`'s restore was broken for every
# municipality while its rehearsal reported success, because the rehearsal
# counted rows instead of writing them (§8 of AGENTS.md).
#
# ── What a complete backup of this project actually is ──────────────────────
#
# Three things, and it took a gap to notice the second one:
#
#   1. `<base>.dump`               the registry (`public`) and every `tenant_*`
#                                  schema — the register itself.
#   2. `<base>.auth-storage.dump`  the `auth` and `storage` schemas. Staff rows
#                                  in `tenant_*.users` link to `auth.users` by
#                                  *email*, not by id, and every password hash
#                                  lives there. Without this file a recovery
#                                  returns the register with nobody able to
#                                  sign in to it.
#   3. `storage/<bucket>/…`        the bytes of the scanned identity documents.
#                                  The dumps carry the rows that name them.
#
# Losing any one of the three is a recovery that does not finish.
#
# ── Nothing in this workflow can write to production ─────────────────────────
#
# `scripts/db/backup.mjs` opens every connection, its own and `pg_dump`'s, with
# `default_transaction_read_only=on`, and aborts if the server does not confirm
# it. `scripts/db/verify-restore.mjs` refuses any `--into` that resolves to a
# known Supabase ref or to a non-loopback host, with no override flag.
#
# ── Nothing in this workflow deletes ─────────────────────────────────────────
#
# Retention is a bucket lifecycle rule, configured once in Cloudflare, not a
# prune step here. That is what lets the upload credential be write-only: a
# token that can delete your backups is a token that can lose your backups, and
# the usual way people discover this is during the incident the backups were for.
# See docs/database-environments.md §5.

on:
  schedule:
    # 22:00 UTC — around midnight in Beirut, after the day's data entry and
    # clear of the two Vercel crons at 01:00 and 02:00 UTC.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Dump and prove it restores, but upload nothing (rehearsal)'
        type: boolean
        default: false

# Separate from `deploy-production` on purpose. Sharing it would mean a nightly
# backup can cancel a queued migration, and GitHub's queue only holds one
# pending run. The hazard in the other direction is real but handled at the
# database: `pg_dump` holds ACCESS SHARE on every table for the length of the
# dump, so a migration's ALTER TABLE started mid-dump would queue behind it —
# and every query arriving after that queues behind the ALTER. Do not run a
# production migration during the backup window.
concurrency:
  group: backup-production
  cancel-in-progress: false

jobs:
  backup:
    name: dump · verify · encrypt · upload
    runs-on: ubuntu-latest
    environment: db-production
    timeout-minutes: 60

    services:
      # The throwaway the dump is restored into. 17, matching `ci.yml` and the
      # production server — `pg_restore` from a newer server into an older one
      # fails, and migration 0044 needs 17 regardless.
      verify:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: verify
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: verify
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U verify -d verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Postgres 17 client, age and rclone
        # The runner's default client is older than the server, and `pg_dump`
        # refuses to dump a server newer than itself. The PGDG repository is the
        # supported way to get a matching pair.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age rclone
          pg_dump --version
          age --version
          rclone --version | head -1

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Materialise production env
        # `targets.mjs` refuses this file if any connection string in it names a
        # project other than the pinned production ref, so a mis-set secret is a
        # hard failure here rather than a backup of the wrong database.
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SERVICE_ROLE_KEY }}
        run: |
          {
            echo "NODE_ENV=production"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "DIRECT_URL=$DIRECT_URL"
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            echo "SUPABASE_STORAGE_BUCKET=documents"
          } > apps/backend/.env.production

      - name: Dump
        id: dump
        run: node scripts/db/backup.mjs production --out "$RUNNER_TEMP/backup"

      - name: Prove it restores
        id: verify
        # The whole reason this job is more than three lines. Restores the real
        # dump into the throwaway above and checks it against its own manifest.
        # A failure here stops the job before anything is uploaded.
        run: |
          node scripts/db/verify-restore.mjs \
            --dump "$RUNNER_TEMP/backup/${{ steps.dump.outputs.dump_file }}" \
            --aux "$RUNNER_TEMP/backup/${{ steps.dump.outputs.aux_file }}" \
            --manifest "$RUNNER_TEMP/backup/${{ steps.dump.outputs.manifest_file }}" \
            --into "postgresql://verify:verify@localhost:5432/verify"

      - name: Encrypt
        # `age` with a recipient public key: this runner can encrypt and cannot
        # decrypt. The private key never exists in CI, in Vercel, or in this
        # repository — it lives offline with the municipality. That is what makes
        # storing this on infrastructure outside Lebanon a question about who
        # holds one key rather than about who can read a register of national ID
        # numbers, addresses and residency status.
        if: ${{ !inputs.skip_upload }}
        env:
          AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          if [ -z "$AGE_PUBLIC_KEY" ]; then
            echo "::error::BACKUP_AGE_PUBLIC_KEY is not set. Refusing to upload plaintext."
            exit 1
          fi
          cd "$RUNNER_TEMP/backup"
          for f in *.dump *.manifest.json; do
            age -r "$AGE_PUBLIC_KEY" -o "$f.age" "$f"
            rm -f "$f"
          done
          sha256sum *.age | tee "$RUNNER_TEMP/backup/CHECKSUMS.txt"
          ls -la

      - name: Configure rclone
        if: ${{ !inputs.skip_upload }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
        run: |
          mkdir -p ~/.config/rclone
          umask 077
          {
            echo "[r2]"
            echo "type = s3"
            echo "provider = Cloudflare"
            echo "access_key_id = $R2_ACCESS_KEY_ID"
            echo "secret_access_key = $R2_SECRET_ACCESS_KEY"
            echo "endpoint = https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
            echo "acl = private"
            echo
            echo "[b2]"
            echo "type = b2"
            echo "account = $B2_KEY_ID"
            echo "key = $B2_APPLICATION_KEY"
            echo
            echo "[supastorage]"
            echo "type = s3"
            echo "provider = Other"
            echo "access_key_id = $SUPABASE_S3_ACCESS_KEY_ID"
            echo "secret_access_key = $SUPABASE_S3_SECRET_ACCESS_KEY"
            echo "endpoint = ${SUPABASE_URL}/storage/v1/s3"
            echo "region = us-east-1"
          } > ~/.config/rclone/rclone.conf

      - name: Upload to Cloudflare R2
        if: ${{ !inputs.skip_upload }}
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # `copy`, never `sync`. `sync` makes the destination match the source,
          # which means it deletes. A backup destination that mirrors deletions
          # propagates the accident you are backing up against.
          rclone copy "$RUNNER_TEMP/backup" "r2:$R2_BUCKET/db/daily/" \
            --include "*.age" --include "CHECKSUMS.txt" --progress --stats-one-line

      - name: Verify the upload actually arrived
        # Exit code 0 from an upload says a command ran (§5). This re-reads the
        # object back out of R2 and compares its checksum with what was sent.
        # Egress from R2 is free, which is the practical reason this check can
        # exist at all — on a provider that bills egress, it is the first thing
        # to get dropped.
        if: ${{ !inputs.skip_upload }}
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readback"
          # Every artefact of this run, not just the main dump: the auth archive
          # holds the staff password hashes, and an unverified upload of it is
          # the half of the backup nobody notices is missing until a recovery.
          rclone copy "r2:$R2_BUCKET/db/daily/" "$RUNNER_TEMP/readback/" \
            --include "${{ steps.dump.outputs.basename }}*.age"
          cd "$RUNNER_TEMP/readback"
          grep "${{ steps.dump.outputs.basename }}" "$RUNNER_TEMP/backup/CHECKSUMS.txt" > expected.txt
          # Three artefacts: the main dump, the auth+storage dump, the manifest.
          n=$(wc -l < expected.txt)
          if [ "$n" -ne 3 ]; then
            echo "::error::Expected 3 uploaded artefacts to verify, found $n."
            cat expected.txt
            exit 1
          fi
          sha256sum -c expected.txt
          echo "✓ all $n artefacts round-tripped out of R2 intact"

      - name: Upload to Backblaze B2 (second vendor)
        # Deliberately a different company with a different credential. With no
        # platform backup underneath, a single R2 account lockout, a mistyped
        # bucket lifecycle rule, or one leaked token is total loss.
        if: ${{ !inputs.skip_upload }}
        continue-on-error: true
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          if [ -z "${B2_BUCKET:-}" ]; then
            echo "::warning::B2_BUCKET not set — only one copy of this backup exists."
            exit 0
          fi
          rclone copy "$RUNNER_TEMP/backup" "b2:$B2_BUCKET/db/daily/" \
            --include "*.age" --include "CHECKSUMS.txt" --stats-one-line

      - name: Back up storage objects
        # The scanned identity documents, ownership proofs and rental contracts.
        # These live in object storage, not in Postgres, so the dump above holds
        # only `documents.storage_path` — a restore without this step brings back
        # a register in which every scanned document is a dead link.
        #
        # `copy` again, and incremental: only objects not already at the
        # destination are transferred, so this costs the delta rather than the
        # whole bucket every night.
        if: ${{ !inputs.skip_upload }}
        id: storage
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_S3_ACCESS_KEY_ID:-}" ]; then
            echo "::error::SUPABASE_S3_ACCESS_KEY_ID is not set — storage objects are NOT backed up."
            echo "Create S3 access keys: Supabase dashboard → Storage → S3 Access Keys."
            exit 1
          fi
          for bucket in documents cadastre; do
            echo "── $bucket ──"
            rclone copy "supastorage:$bucket" "r2:$R2_BUCKET/storage/$bucket/" \
              --stats-one-line --transfers 8
          done
          rclone size "r2:$R2_BUCKET/storage/"

      - name: Report
        # Runs whatever happened above, because a backup report that only
        # describes the successful half is how "we have backups" survives
        # contact with a step that has been failing for a month (§5).
        if: always()
        run: |
          echo "### Backup — production" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rows dumped (registry + tenants) | ${{ steps.dump.outputs.total_rows || 'n/a' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rows dumped (auth + storage) | ${{ steps.dump.outputs.aux_total_rows || 'n/a' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dump size | ${{ steps.dump.outputs.bytes || 'n/a' }} + ${{ steps.dump.outputs.aux_bytes || 'n/a' }} bytes |" >> "$GITHUB_STEP_SUMMARY"
          # Reads the *verify* step, not the dump step. It read `steps.dump`
          # before, so a restore rehearsal that failed still printed "passed" —
          # a report describing the step that was easy to reach rather than the
          # one that carries the claim (§5).
          echo "| Restore rehearsal | ${{ steps.verify.outcome || 'did not run' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Storage object bytes | ${{ steps.storage.outcome || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.storage.outcome }}" = "failure" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **The database is backed up; the scanned documents are not.**" >> "$GITHUB_STEP_SUMMARY"
            echo "> A restore from this backup would return rows whose document links are dead." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if any half of the backup is missing
        # `continue-on-error` above lets the database backup land even when
        # storage is misconfigured — a partial backup beats none. It must not
        # also let the job go green, or the missing half becomes permanent.
        if: ${{ always() && !inputs.skip_upload && steps.storage.outcome == 'failure' }}
        run: |
          echo "::error::Database backed up, storage objects were not. This backup is incomplete."
          exit 1

      - name: Shred
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/backup" "$RUNNER_TEMP/readback"
          rm -f apps/backend/.env.production ~/.config/rclone/rclone.conf
