name: Deploy staging

# Staging migrates itself on every push to develop that touches a migration, so
# a change runs unattended somewhere real before main ever sees it. Production
# runs from main also migrate staging first, which keeps the promotion check in
# scripts/db/deploy.mjs meaningful for a branch merged straight to main.
on:
  push:
    branches: [develop]
    paths:
      - 'apps/backend/src/infrastructure/prisma/**'
      - 'scripts/db/**'
      - '.github/workflows/deploy-staging.yml'
      - '.github/workflows/migrate-database.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report pending migrations without applying them'
        type: boolean
        default: false

jobs:
  migrate:
    name: migrate staging database
    uses: ./.github/workflows/migrate-database.yml
    with:
      target: staging
      # Unset on a push, where it reads as false: pushes apply.
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
