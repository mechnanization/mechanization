name: Rollback Production
run-name: Rollback to ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'previous | list | commit SHA (e.g. d3cb97d) | release name (e.g. 20261006093952-d3cb97d)'
        required: true
        default: 'previous'

# Read only (SEC-09): the job reaches the box over SSH and asks GitHub for nothing.
permissions:
  contents: read

# Never at the same time as a deploy: `deploy-backend.yml` takes the same group.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    # The environment that holds the box's SSH key, as the deploy's (SEC-09):
    # it admits protected branches only, so a rollback dispatched from any
    # other branch is refused before it starts.
    environment: db-production
    steps:
      - name: Trust the server's host key and load the deploy key
        # OpenSSH, as the deploy and the migration tunnel do, in place of a
        # third-party action pinned by tag; the host key is checked against
        # SSH_KNOWN_HOSTS and never learned on the fly.
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS is not set. Add the server's host keys: see docs/database-environments.md §6."
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/deploy_known_hosts"
          {
            echo "Host deploy-box"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  IdentityFile $HOME/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  UserKnownHostsFile $HOME/.ssh/deploy_known_hosts"
            echo "  StrictHostKeyChecking yes"
            echo "  BatchMode yes"
            echo "  ServerAliveInterval 30"
          } >> "$HOME/.ssh/config"

      - name: Switch production to the selected release
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # Checked here before it is put into the command the box runs, and
          # again there: letters, digits and hyphens only.
          if ! [[ "$TARGET" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "::error::invalid target '$TARGET'"; exit 1
          fi
          remote=$(cat <<'REMOTE'
            set -euo pipefail
            BASE=/var/www/municipality-app-releases
            cd "$BASE/releases"

            # Checked again here: the runner checked it before putting it into this command
            if ! [[ "$TARGET" =~ ^[A-Za-z0-9-]+$ ]]; then
              echo "FATAL: invalid target '$TARGET'"; exit 1
            fi

            CURRENT=$(basename "$(readlink -f "$BASE/current")")

            if [ "$TARGET" = "list" ]; then
              echo "Available releases (newest last):"
              for r in $(ls -1 | sort); do
                if [ "$r" = "$CURRENT" ]; then echo "  $r   <-- CURRENT"; else echo "  $r"; fi
              done
              exit 0
            fi

            if [ "$TARGET" = "previous" ]; then
              NEW=$(ls -1 | sort | awk -v c="$CURRENT" '$0 < c' | tail -1)
            elif [ -d "$TARGET" ]; then
              NEW="$TARGET"
            else
              SHORT="${TARGET:0:7}"
              NEW=$(ls -1d -- *-"$SHORT" 2>/dev/null | sort | tail -1 || true)
            fi

            if [ -z "${NEW:-}" ] || [ ! -d "$NEW" ]; then
              echo "FATAL: no release found for '$TARGET'. Available:"; ls -1 | sort; exit 1
            fi
            if [ ! -f "$NEW/apps/backend/dist/presentation/main.js" ]; then
              echo "FATAL: $NEW is incomplete (main.js missing)"; exit 1
            fi
            if [ "$NEW" = "$CURRENT" ]; then
              echo "Already running $NEW, nothing to do."; exit 0
            fi

            echo "Rolling back: $CURRENT  ->  $NEW"
            ln -sfn "$BASE/releases/$NEW" "$BASE/current"
            pm2 reload "$BASE/ecosystem.config.js"

            sleep 3
            for i in $(seq 1 30); do
              if curl -sf http://localhost:4000/api/v1/health > /dev/null; then
                echo "Production healthy on $NEW"
                exit 0
              fi
              sleep 2
            done

            echo "Health check FAILED on $NEW, restoring $CURRENT"
            ln -sfn "$BASE/releases/$CURRENT" "$BASE/current"
            pm2 reload "$BASE/ecosystem.config.js"
            exit 1
          REMOTE
          )
          ssh deploy-box "TARGET='$TARGET'; $remote"
