name: Deploy production

# Production is migrated automatically on every push to main: `deploy-backend.yml`
# runs the migrations, through the guard and staging first, before the code
# that needs them ships. This button is for the two things that must not
# happen automatically:
#
#   - a dry run: report what is pending on staging and production, change
#     nothing. The default, and the first thing to do when in doubt;
#   - the contract half of an expand/contract change (DROP COLUMN, RENAME, a
#     type change), which the guard refuses unless `allow_destructive` is
#     ticked here, and only here.
#
# Both paths call the same reusable workflow, so there is one way to reach the
# production database, not two. The typed database name is checked by
# scripts/db/deploy.mjs against the target it is pinned to.
on:
  workflow_dispatch:
    inputs:
      confirm_ref:
        description: 'Type the production database name (municipality_db) to confirm'
        required: true
        type: string
      dry_run:
        description: 'Report what would be applied, change nothing (do this first)'
        type: boolean
        default: true
      allow_destructive:
        description: 'Permit data-losing DDL (contract half of an expand/contract cycle only)'
        type: boolean
        default: false

jobs:
  migrate:
    name: migrate production database
    uses: ./.github/workflows/migrate-database.yml
    with:
      target: production
      dry_run: ${{ inputs.dry_run }}
      allow_destructive: ${{ inputs.allow_destructive }}
      # Free text a human typed. It reaches the script through the environment
      # inside the called workflow, never interpolated into a command line.
      confirm: ${{ inputs.confirm_ref }}
    secrets: inherit
